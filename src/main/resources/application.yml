server:
  port: ${PORT:8080}

spring:
  application:
    name: web-app-template

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  sql:
    init:
      mode: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  features:
    catalog: true
    orders: true
    availability-requests: true
  theme:
    primary-color: "#6366f1"
  pagination:
    default-size: 20
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-per-minute: ${RATE_LIMIT_REFILL_PER_MINUTE:60}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
